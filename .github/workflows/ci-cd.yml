name: CI/CD Pipeline - HomeTask WebApi

# O pipeline será ativado quando houver um push ou pull request em qualquer branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  REGISTRY: ghcr.io
  # O nome da imagem será o nome do usuário/repositório (ex: augusto-klug/hometaskwebapi)
  IMAGE_NAME: ${{ github.repository_owner }}/hometaskwebapi

jobs:
  # Job 1: Build da aplicação .NET para validar o código
  build-dotnet:
    name: Build .NET 10
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restaurar dependências
      run: dotnet restore HomeTask.WebApi/HomeTask.WebApi.csproj

    - name: Build da Solução
      run: dotnet build HomeTask.WebApi/HomeTask.WebApi.csproj --configuration Release --no-restore

  # Job 2: Build da imagem Docker e Push para o Registry do GitHub
  build-and-push-docker:
    name: Build & Push Docker Image
    needs: build-dotnet # Só roda se o Job 1 (build .NET) passar
    runs-on: ubuntu-latest
    # Só publica a imagem se for um Push (Ignora Pull Requests)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write # Necessário para publicar no GHCR

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Logar no GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        # O GITHUB_TOKEN é gerado automaticamente pelo Actions, não precisa de configuração manual!
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extrair metadata (tags, labels) para o Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=sha

    - name: Build e Push da imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
