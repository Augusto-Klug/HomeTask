<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscar Serviços — HomeTask</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/index.html"><span class="fw-bold text-primary">HomeTask</span></a>
        <div class="ms-auto d-flex gap-2" id="nav-auth"></div>
    </div>
</nav>

<div class="container py-4 flex-grow-1" id="app">
    <h4 class="fw-bold mb-4">Buscar Serviços</h4>

    <!-- Filtros -->
    <div class="card mb-4 p-3">
        <form @submit.prevent="buscar" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Categoria</label>
                <select v-model="filtro.categoria" class="form-select">
                    <option value="">Todas</option>
                    <option v-for="c in categorias" :key="c.id" :value="c.id">{{ c.nome }}</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Cidade</label>
                <input v-model="filtro.cidade" type="text" class="form-control" placeholder="Ex.: São Paulo" />
            </div>
            <div class="col-md-2">
                <label class="form-label">Preço máx. (R$)</label>
                <input v-model.number="filtro.precoMaximo" type="number" class="form-control" placeholder="Ex.: 200" min="0" />
            </div>
            <div class="col-md-2">
                <label class="form-label">Avaliação mín.</label>
                <select v-model.number="filtro.avaliacaoMinima" class="form-select">
                    <option value="0">Qualquer</option>
                    <option value="3">3+ ⭐</option>
                    <option value="4">4+ ⭐</option>
                    <option value="4.5">4.5+ ⭐</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search me-1"></i> Buscar
                </button>
            </div>
        </form>
    </div>

    <!-- Loading -->
    <div v-if="carregando" class="spinner-overlay">
        <div class="spinner-border text-primary"></div>
    </div>

    <!-- Sem resultados -->
    <div v-else-if="!carregando && servicos.length === 0 && buscou" class="text-center py-5 text-muted">
        <i class="bi bi-search fs-1 d-block mb-3"></i>
        Nenhum serviço encontrado. Tente outros filtros.
    </div>

    <!-- Resultados -->
    <div v-else class="row g-3">
        <div v-for="s in servicos" :key="s.id" class="col-md-6 col-lg-4">
            <div class="card h-100 servico-card" @click="verDetalhes(s.id)">
                <div class="card-body">
                    <span class="badge badge-categoria bg-primary-subtle text-primary mb-2">{{ s.categoriaNome }}</span>
                    <h6 class="fw-bold mb-1">{{ s.titulo }}</h6>
                    <p class="text-muted small mb-2">{{ s.descricao }}</p>
                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <div>
                            <div class="fw-semibold text-primary">R$ {{ formatarPreco(s.precoBase) }}</div>
                            <small class="text-muted">{{ s.cidade }}</small>
                        </div>
                        <div class="text-end">
                            <div class="stars small">{{ estrelas(s.mediaAvaliacoes) }}</div>
                            <small class="text-muted">{{ s.prestadorNome }}</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="mt-auto">
    <div class="container text-center">
        <p class="mb-0">© 2024 HomeTask</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app-buscar.js"></script>
</body>
</html>
