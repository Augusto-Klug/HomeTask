<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Agendamento — HomeTask</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="d-flex align-items-center min-vh-100 bg-light py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card p-4" id="app">
                <h4 class="fw-bold mb-1">Novo Agendamento</h4>
                <p v-if="servico" class="text-muted mb-4">
                    {{ servico.titulo }} — <strong>{{ servico.prestadorNome }}</strong>
                </p>

                <div v-if="erro" class="alert alert-danger">{{ erro }}</div>

                <form @submit.prevent="agendar">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Data</label>
                            <input v-model="form.data" type="date" class="form-control" required :min="hoje" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Horário</label>
                            <input v-model="form.hora" type="time" class="form-control" required />
                        </div>
                        <div class="col-12">
                            <label class="form-label">Endereço do serviço</label>
                            <input v-model="form.endereco" type="text" class="form-control"
                                   placeholder="Rua, número, bairro, cidade" required />
                        </div>
                        <div class="col-12">
                            <label class="form-label">Observações</label>
                            <textarea v-model="form.observacoes" class="form-control" rows="3"
                                      placeholder="Alguma instrução especial para o prestador?"></textarea>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" :disabled="carregando">
                            <span v-if="carregando" class="spinner-border spinner-border-sm me-2"></span>
                            Confirmar Agendamento
                        </button>
                        <a href="/servicos/buscar.html" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app-agendamento.js"></script>
</body>
</html>
