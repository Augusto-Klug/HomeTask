<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — HomeTask</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="d-flex align-items-center min-vh-100 bg-light">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <a href="/index.html" class="text-decoration-none">
                    <h3 class="fw-bold text-primary">HomeTask</h3>
                </a>
                <p class="text-muted">Acesse sua conta</p>
            </div>
            <div class="card p-4" id="app">
                <div v-if="erro" class="alert alert-danger d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    {{ erro }}
                </div>
                <form @submit.prevent="login">
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input v-model="email" type="email" class="form-control" placeholder="seu@email.com" required />
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <div class="input-group">
                            <input v-model="senha" :type="mostrarSenha ? 'text' : 'password'"
                                   class="form-control" placeholder="••••••••" required />
                            <button type="button" class="btn btn-outline-secondary"
                                    @click="mostrarSenha = !mostrarSenha">
                                <i :class="mostrarSenha ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" :disabled="carregando">
                        <span v-if="carregando" class="spinner-border spinner-border-sm me-2"></span>
                        Entrar
                    </button>
                </form>
                <hr />
                <p class="text-center mb-0 text-muted small">
                    Não tem conta? <a href="/cadastro.html">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app-login.js"></script>
</body>
</html>
