<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro — HomeTask</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="d-flex align-items-center min-vh-100 bg-light py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="text-center mb-4">
                <a href="/index.html" class="text-decoration-none">
                    <h3 class="fw-bold text-primary">HomeTask</h3>
                </a>
                <p class="text-muted">Crie sua conta gratuitamente</p>
            </div>
            <div class="card p-4" id="app">
                <div v-if="erro" class="alert alert-danger d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-circle-fill"></i> {{ erro }}
                </div>
                <form @submit.prevent="cadastrar">
                    <!-- Tipo de conta -->
                    <div class="mb-3">
                        <label class="form-label">Tipo de conta</label>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" v-model="form.tipoUsuario" value="1" id="tipoCliente" />
                                <label class="form-check-label" for="tipoCliente">
                                    🏠 Cliente <small class="text-muted">(contratar serviços)</small>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" v-model="form.tipoUsuario" value="2" id="tipoPrestador" />
                                <label class="form-check-label" for="tipoPrestador">
                                    🔧 Prestador <small class="text-muted">(oferecer serviços)</small>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" v-model="form.tipoUsuario" value="3" id="tipoAmbos" />
                                <label class="form-check-label" for="tipoAmbos">
                                    ⭐ Ambos <small class="text-muted">(contratar e oferecer)</small>
                                </label>
                            </div>
                        </div>
                        <div v-if="form.tipoUsuario === '3'" class="alert alert-info mt-2 py-2 small mb-0">
                            <i class="bi bi-info-circle me-1"></i>
                            Uma única conta com os dois perfis. Você poderá alternar entre cliente e prestador após o login.
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Nome completo</label>
                            <input v-model="form.nome" type="text" class="form-control" placeholder="João da Silva" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">E-mail</label>
                            <input v-model="form.email" type="email" class="form-control" placeholder="seu@email.com" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">CPF</label>
                            <input v-model="form.cpf" type="text" class="form-control" placeholder="000.000.000-00" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone</label>
                            <input v-model="form.telefone" type="tel" class="form-control" placeholder="(11) 99999-9999" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Senha</label>
                            <input v-model="form.senha" type="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6" />
                        </div>

                        <!-- Campos extras para Prestador ou Ambos -->
                        <template v-if="form.tipoUsuario === '2' || form.tipoUsuario === '3'">
                            <div class="col-12"><hr class="my-1" /><small class="text-muted fw-semibold">Dados profissionais</small></div>
                            <div class="col-md-6">
                                <label class="form-label">Cidade</label>
                                <input v-model="form.cidade" type="text" class="form-control" placeholder="São Paulo" required />
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Estado</label>
                                <input v-model="form.estado" type="text" class="form-control" placeholder="SP" maxlength="2" required />
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Raio (km)</label>
                                <input v-model.number="form.raioAtendimentoKm" type="number" class="form-control" value="10" min="1" />
                            </div>
                            <div class="col-12">
                                <label class="form-label">Descrição profissional</label>
                                <textarea v-model="form.descricao" class="form-control" rows="3" placeholder="Fale sobre sua experiência..."></textarea>
                            </div>
                        </template>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-4" :disabled="carregando">
                        <span v-if="carregando" class="spinner-border spinner-border-sm me-2"></span>
                        Criar Conta
                    </button>
                </form>
                <hr />
                <p class="text-center mb-0 text-muted small">
                    Já tem conta? <a href="/login.html">Entrar</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app-cadastro.js"></script>
</body>
</html>
